name: README build

on:
  schedule:
    - cron: "0 4 * * *"   # 09:30 IST, so the card's date and uptime roll over each morning
  push:
    branches: [main]
    paths: [today.py, art/portrait.txt, requirements.txt, .github/workflows/build.yaml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}   # fallback: public data only
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --staged --quiet; then
            echo "Card unchanged."
          else
            git commit -m "chore: update stats"
            git push
          fi
