name: Unpack profile bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          tar xzf 1-bundle3.tgz README.md art
          rm 1-bundle3.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md art
          git commit -m "Profile art: animated GIFs with still fallbacks"
          git push
